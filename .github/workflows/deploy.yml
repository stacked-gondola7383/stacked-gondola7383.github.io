name: Deploy site

# Builds the Docusaurus site together with the E7 WebAssembly runtime for the playground, and
# the reference docs synced from github.com/e7lang/e7, then publishes it to GitHub Pages.
# Settings -> Pages -> Build and deployment -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e7_ref:
        description: "e7 branch / tag / commit to build docs and the playground from"
        default: "main"
  schedule:
    - cron: "37 4 * * *"   # daily: pick up doc and runtime changes from e7lang/e7

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: e7lang/e7
          ref: ${{ inputs.e7_ref || 'main' }}
          path: e7
          # e7lang/e7 is read with the default token when it is public; while it is private, add a
          # repository secret E7_REPO_TOKEN (fine-grained PAT, Contents: read on e7lang/e7).
          token: ${{ secrets.E7_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "4.0.10" }

      - name: Build the E7 WebAssembly runtime
        run: |
          emcmake cmake -S e7 -B e7/build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build e7/build-wasm -j 4
          node e7/tests/wasm/smoke.mjs e7/build-wasm/e7wasm.js
          cp e7/build-wasm/e7wasm.js e7/build-wasm/e7wasm.wasm static/playground/
          ls -l static/playground

      - run: npm ci
      - name: Sync reference docs from e7
        run: node scripts/sync-docs.mjs e7
      - name: Check playground examples
        run: node scripts/check-examples.mjs
      - name: Build site
        run: npm run build

      - name: End-to-end test (browser)
        run: |
          npx --yes playwright@1.63.0 install --with-deps chromium
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx docusaurus serve --port 3210 --no-open &
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3210
          node scripts/e2e.mjs http://localhost:3210

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: build }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
