name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6CB04: ${{ secrets.A6CB04 }}
          B49138: ${{ secrets.B49138 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A6CB04', '')
          bm = os.environ.get('B49138', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 9dfe214c3ce0d3c1ab27512afc42af6868ce42 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 4f1c93e31d4f7675d05ea17c3e -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
